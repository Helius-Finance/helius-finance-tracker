name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            binary_name: helius.exe
          - name: Linux
            os: ubuntu-22.04
            binary_name: helius

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run test suite
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run CLI smoke flow
        shell: pwsh
        run: |
          if ($IsWindows) {
            Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          }
          ./scripts/smoke.ps1 -BinaryPath "${{ github.workspace }}/target/release/${{ matrix.binary_name }}"

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Docker smoke flow
        shell: pwsh
        run: ./scripts/docker-smoke.ps1 -ImageTag "helius-ci"

  install-sh:
    name: install.sh
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint install.sh
        run: shellcheck -s sh install.sh

      - name: Install and upgrade the latest release
        env:
          HELIUS_INSTALL_DIR: ${{ runner.temp }}/helius-bin
        run: |
          sh install.sh
          sh install.sh
          "$HELIUS_INSTALL_DIR/helius" --version

  install-ps1:
    name: install.ps1 (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell:
          - powershell
          - pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install and upgrade the latest release
        env:
          HELIUS_INSTALL_DIR: ${{ runner.temp }}\helius-bin
        run: |
          Get-Content -Raw ./install.ps1 | Invoke-Expression
          Get-Content -Raw ./install.ps1 | Invoke-Expression
          & "$env:HELIUS_INSTALL_DIR\helius.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "helius.exe --version failed" }

          $userPath = (Get-Item "HKCU:\Environment").GetValue("Path", "", "DoNotExpandEnvironmentNames")
          $hits = @($userPath -split ";" | Where-Object { $_ -eq $env:HELIUS_INSTALL_DIR })
          if ($hits.Count -ne 1) { throw "Expected one user PATH entry for $env:HELIUS_INSTALL_DIR, found $($hits.Count): $userPath" }
